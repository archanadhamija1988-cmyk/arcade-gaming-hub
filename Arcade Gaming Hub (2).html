<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON APEX // Mobile Arcade Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: {
                            cyan: '#00f3ff',
                            pink: '#ff007f',
                            purple: '#9d00ff',
                            yellow: '#ffe600',
                            green: '#00ff66',
                            dark: '#0a0a12',
                            card: '#121225'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif']
                    },
                    boxShadow: {
                        'neon-cyan': '0 0 15px rgba(0, 243, 255, 0.5)',
                        'neon-pink': '0 0 15px rgba(255, 0, 127, 0.5)',
                        'neon-purple': '0 0 15px rgba(157, 0, 255, 0.5)',
                        'glow-lg': '0 0 25px rgba(0, 243, 255, 0.4), 0 0 50px rgba(255, 0, 127, 0.2)'
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s infinite alternate',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%': { filter: 'drop-shadow(0 0 5px #00f3ff)' },
                            '100%': { filter: 'drop-shadow(0 0 15px #ff007f)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-6px)' }
                        }
                    }
                }
            }
        }
    </script>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom Mobile Utility Styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a12;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            overflow-x: hidden;
        }

        /* Scanlines Overlay Effect for CRT Arcade Feel */
        .scanline-overlay {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Custom Scrollbar for Horizontal Categories */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Glassmorphism Effect */
        .glass-panel {
            background: rgba(18, 18, 37, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card {
            background: rgba(25, 25, 50, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 243, 255, 0.15);
        }

        /* Active Glow Animations */
        .neon-border-cyan {
            border-color: #00f3ff;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }
    </style>
</head>
<body class="min-h-screen pb-20 relative selection:bg-neon-pink selection:text-white">

    <!-- Scanline Subtle FX Overlay -->
    <div class="fixed inset-0 scanline-overlay z-50 opacity-40"></div>

    <!-- BACKGROUND NEON GLOW BLURS -->
    <div class="fixed -top-20 -left-20 w-64 h-64 bg-neon-purple rounded-full blur-[100px] opacity-30 pointer-events-none"></div>
    <div class="fixed top-1/3 -right-20 w-72 h-72 bg-neon-cyan rounded-full blur-[120px] opacity-25 pointer-events-none"></div>
    <div class="fixed bottom-10 left-10 w-80 h-80 bg-neon-pink rounded-full blur-[120px] opacity-20 pointer-events-none"></div>

    <!-- HEADER / NAVBAR -->
    <header class="sticky top-0 z-40 w-full glass-panel border-b border-white/10 px-4 py-3 transition-all">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-neon-pink to-neon-cyan flex items-center justify-center shadow-neon-cyan animate-pulse-glow">
                    <i class="fa-solid font-black fa-gamepad text-black text-xl"></i>
                </div>
                <span class="font-display font-black text-xl tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-neon-cyan via-white to-neon-pink">
                    NEON<span class="text-neon-pink">APEX</span>
                </span>
            </div>

            <!-- Header Action Icons -->
            <div class="flex items-center space-x-3">
                <button id="favorite-toggle-btn" onclick="toggleFavoritesFilter()" class="relative p-2 rounded-xl bg-white/5 border border-white/10 text-gray-300 active:scale-95 transition-transform">
                    <i class="fa-solid fa-heart text-neon-pink text-lg"></i>
                    <span id="fav-badge" class="hidden absolute -top-1 -right-1 bg-neon-pink text-black text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
                </button>
                <div class="flex items-center space-x-1 pl-2 border-l border-white/10">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-r from-neon-purple to-neon-pink p-[1px]">
                        <img src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=100&auto=format&fit=crop&q=80" alt="Avatar" class="w-full h-full object-cover rounded-full">
                    </div>
                </div>
            </div>
        </div>

        <!-- SEARCH BAR (Mobile Focused) -->
        <div class="mt-3 relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input 
                type="text" 
                id="search-input"
                placeholder="Search games, retro classics..." 
                class="w-full bg-black/50 text-white placeholder-gray-400 text-sm pl-10 pr-10 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:border-neon-cyan focus:ring-1 focus:ring-neon-cyan transition-all"
                onkeyup="handleSearch(event)"
            >
            <button id="clear-search" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                <i class="fa-solid fa-circle-xmark"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 pt-4 space-y-6">

        <!-- HERO BANNER / FEATURED GAME -->
        <section class="relative rounded-2xl overflow-hidden border border-neon-cyan/30 shadow-glow-lg group">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent z-10"></div>
            <img 
                src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800&auto=format&fit=crop&q=80" 
                alt="Cyber Neon Runner" 
                class="w-full h-48 sm:h-64 object-cover object-center group-hover:scale-105 transition-transform duration-500"
            >
            <div class="absolute bottom-0 left-0 right-0 p-4 z-20 flex flex-col justify-end">
                <div class="flex items-center space-x-2 mb-1">
                    <span class="bg-neon-pink text-black text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full tracking-wider">FEATURED</span>
                    <span class="text-xs text-neon-cyan font-semibold"><i class="fa-solid fa-fire mr-1"></i>Trending #1</span>
                </div>
                <h2 class="font-display font-black text-2xl sm:text-3xl text-white tracking-wide drop-shadow-md">CYBER RUNNER 2077</h2>
                <p class="text-xs text-gray-300 line-clamp-1 mt-1">High-speed neon synthwave dash through endless cyber obstacles.</p>
                <div class="mt-3 flex items-center space-x-3">
                    <button onclick="openPlayModal('CYBER RUNNER 2077', 'Action', 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800&auto=format&fit=crop&q=80', 'runner')" class="flex-1 bg-gradient-to-r from-neon-cyan to-blue-600 text-black font-extrabold py-2.5 px-4 rounded-xl flex items-center justify-center space-x-2 shadow-neon-cyan active:scale-95 transition-transform">
                        <i class="fa-solid fa-play text-sm"></i>
                        <span>PLAY NOW</span>
                    </button>
                    <button onclick="toggleFav('hero-fav', this)" class="p-2.5 bg-black/60 backdrop-blur-md rounded-xl border border-white/20 text-white active:scale-95 transition-transform">
                        <i class="fa-regular fa-heart text-lg"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- CATEGORIES SCROLLABLE ROW -->
        <section>
            <div class="flex items-center justify-between mb-2">
                <h3 class="font-display font-bold text-sm text-gray-300 uppercase tracking-widest flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-neon-pink"></i> Categories
                </h3>
                <span id="game-count" class="text-xs text-gray-400 font-mono">12 Games</span>
            </div>
            <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1 -mx-4 px-4" id="categories-container">
                <!-- Dynamic Category Buttons injected by JS -->
            </div>
        </section>

        <!-- GAME GRID SECTION -->
        <section>
            <div class="flex items-center justify-between mb-3">
                <h3 id="section-title" class="font-display font-bold text-base text-white tracking-wide flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-neon-cyan inline-block animate-ping"></span>
                    ALL ARCADE GAMES
                </h3>
            </div>

            <!-- Game Cards Grid -->
            <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3.5">
                <!-- Game cards dynamically rendered -->
            </div>

            <!-- Empty State -->
            <div id="no-results" class="hidden flex-col items-center justify-center py-12 text-center space-y-3">
                <div class="w-16 h-16 rounded-full bg-white/5 flex items-center justify-center border border-white/10 text-gray-500 text-2xl">
                    <i class="fa-solid fa-ghost"></i>
                </div>
                <p class="text-gray-400 text-sm font-medium">No neon games found matching your search.</p>
                <button onclick="resetFilters()" class="text-xs text-neon-cyan font-bold underline uppercase tracking-wider">Reset Filters</button>
            </div>
        </section>

    </main>

    <!-- BOTTOM NAVIGATION (Android Optimized App Bar) -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 glass-panel border-t border-white/10 px-6 py-2">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <button onclick="filterCategory('All')" class="nav-item flex flex-col items-center text-neon-cyan">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-bold mt-1">Home</span>
            </button>
            <button onclick="filterCategory('Trending')" class="nav-item flex flex-col items-center text-gray-400 hover:text-white">
                <i class="fa-solid fa-fire text-lg"></i>
                <span class="text-[10px] font-bold mt-1">Trending</span>
            </button>
            <button onclick="toggleFavoritesFilter()" class="nav-item flex flex-col items-center text-gray-400 hover:text-white">
                <i class="fa-solid fa-heart text-lg"></i>
                <span class="text-[10px] font-bold mt-1">Favorites</span>
            </button>
            <button onclick="showRandomGame()" class="nav-item flex flex-col items-center text-gray-400 hover:text-white">
                <i class="fa-solid fa-dice text-lg"></i>
                <span class="text-[10px] font-bold mt-1">Random</span>
            </button>
        </div>
    </nav>

    <!-- PLAY GAME MODAL / SIMULATOR -->
    <div id="play-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-xl hidden flex-col transition-opacity duration-300">
        <!-- Modal Top Bar -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-white/10 bg-black/60">
            <div class="flex items-center space-x-3">
                <button onclick="closePlayModal()" class="p-2 text-gray-400 active:text-white active:scale-95">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </button>
                <div>
                    <h3 id="modal-game-title" class="font-display font-bold text-sm text-white">GAME TITLE</h3>
                    <p id="modal-game-cat" class="text-[10px] text-neon-cyan uppercase">Category</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="toggleFullscreen()" class="p-2 text-gray-400 active:text-neon-cyan">
                    <i class="fa-solid fa-expand text-base"></i>
                </button>
                <button onclick="closePlayModal()" class="p-2 text-gray-400 active:text-neon-pink">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Simulated Game Viewport -->
        <div id="game-canvas-container" class="flex-1 relative bg-slate-950 flex flex-col items-center justify-center p-4 overflow-hidden">
            <!-- Simulated Canvas Arcader Frame -->
            <div id="simulated-game-frame" class="w-full h-full max-w-md max-h-[500px] bg-gradient-to-b from-gray-900 to-black rounded-2xl border-2 border-neon-cyan/40 shadow-neon-cyan relative flex flex-col items-center justify-between p-6 text-center">
                
                <div class="w-full flex justify-between items-center text-xs font-mono text-neon-green">
                    <span>SCORE: <span id="sim-score">00000</span></span>
                    <span>FPS: 60</span>
                </div>

                <div class="my-auto space-y-4">
                    <div id="sim-game-icon" class="w-20 h-20 mx-auto rounded-2xl bg-neon-purple/20 border border-neon-purple flex items-center justify-center text-4xl text-neon-cyan animate-float">
                        <i class="fa-solid fa-gamepad"></i>
                    </div>
                    <div>
                        <h4 class="font-display text-xl font-bold text-white tracking-wide" id="sim-game-name">Cyber Runner</h4>
                        <p class="text-xs text-gray-400 mt-1">Tap controls to simulate gameplay!</p>
                    </div>
                </div>

                <!-- On-Screen Arcade Touch Controls for Android -->
                <div class="w-full pt-4 border-t border-white/10 grid grid-cols-3 gap-2 items-center">
                    <div class="flex gap-1 justify-center">
                        <button onclick="triggerGameAction('LEFT')" class="w-12 h-12 bg-white/10 active:bg-neon-cyan active:text-black rounded-xl border border-white/20 text-white text-lg font-bold flex items-center justify-center active:scale-95 transition-transform">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>
                        <button onclick="triggerGameAction('RIGHT')" class="w-12 h-12 bg-white/10 active:bg-neon-cyan active:text-black rounded-xl border border-white/20 text-white text-lg font-bold flex items-center justify-center active:scale-95 transition-transform">
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                    <div class="text-center">
                        <span id="action-feedback" class="text-[10px] font-mono text-neon-yellow uppercase">READY</span>
                    </div>
                    <div class="flex justify-center">
                        <button onclick="triggerGameAction('JUMP')" class="w-14 h-14 bg-gradient-to-tr from-neon-pink to-neon-purple active:scale-90 rounded-full border border-white/30 text-white font-bold text-xs shadow-neon-pink flex items-center justify-center transition-transform">
                            ACTION
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Game Database
        const gamesData = [
            {
                id: '1',
                title: 'CYBER RUNNER 2077',
                category: 'Action',
                rating: '4.9',
                plays: '120k',
                image: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500&auto=format&fit=crop&q=80',
                badge: 'HOT',
                type: 'runner'
            },
            {
                id: '2',
                title: 'NEON IN VADERS',
                category: 'Retro',
                rating: '4.7',
                plays: '85k',
                image: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500&auto=format&fit=crop&q=80',
                badge: 'CLASSIC',
                type: 'space'
            },
            {
                id: '3',
                title: 'SYNTH DRIFT 3D',
                category: 'Racing',
                rating: '4.8',
                plays: '210k',
                image: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?w=500&auto=format&fit=crop&q=80',
                badge: 'NEW',
                type: 'car'
            },
            {
                id: '4',
                title: 'PIXEL PUZZLE NEON',
                category: 'Puzzle',
                rating: '4.5',
                plays: '45k',
                image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=80',
                badge: '',
                type: 'puzzle'
            },
            {
                id: '5',
                title: 'RETRO BRICK BREAKER',
                category: 'Retro',
                rating: '4.6',
                plays: '95k',
                image: 'https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=500&auto=format&fit=crop&q=80',
                badge: '',
                type: 'brick'
            },
            {
                id: '6',
                title: 'GALAXY BASTER',
                category: 'Shooter',
                rating: '4.9',
                plays: '310k',
                image: 'https://images.unsplash.com/photo-1579373903781-fd5c0c30c4cd?w=500&auto=format&fit=crop&q=80',
                badge: 'TOP',
                type: 'shooter'
            },
            {
                id: '7',
                title: 'NEON COMBAT',
                category: 'Action',
                rating: '4.4',
                plays: '62k',
                image: 'https://images.unsplash.com/photo-1563089145-599997674d42?w=500&auto=format&fit=crop&q=80',
                badge: '',
                type: 'fight'
            },
            {
                id: '8',
                title: 'TETRA GLOW',
                category: 'Puzzle',
                rating: '4.8',
                plays: '150k',
                image: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500&auto=format&fit=crop&q=80',
                badge: 'POPULAR',
                type: 'blocks'
            }
        ];

        const categories = ['All', 'Action', 'Retro', 'Racing', 'Shooter', 'Puzzle'];

        let currentCategory = 'All';
        let searchQuery = '';
        let favorites = JSON.parse(localStorage.getItem('neon_favs') || '[]');
        let showFavsOnly = false;
        let simScore = 0;

        // Initialize UI on Load
        document.addEventListener('DOMContentLoaded', () => {
            renderCategories();
            renderGames();
            updateFavBadge();
        });

        // Render Category Filter Buttons
        function renderCategories() {
            const container = document.getElementById('categories-container');
            container.innerHTML = categories.map(cat => `
                <button 
                    onclick="filterCategory('${cat}')" 
                    class="px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200 whitespace-nowrap active:scale-95 ${
                        currentCategory === cat && !showFavsOnly
                        ? 'bg-gradient-to-r from-neon-cyan to-blue-600 text-black shadow-neon-cyan font-black' 
                        : 'bg-white/5 border border-white/10 text-gray-300 hover:border-neon-cyan/50'
                    }"
                >
                    ${cat === 'All' ? '<i class="fa-solid fa-border-all mr-1"></i>' : ''}
                    ${cat}
                </button>
            `).join('');
        }

        // Filter by Category
        function filterCategory(cat) {
            showFavsOnly = false;
            currentCategory = cat;
            document.getElementById('section-title').innerHTML = `
                <span class="w-2 h-2 rounded-full bg-neon-cyan inline-block animate-ping"></span>
                ${cat.toUpperCase()} GAMES
            `;
            renderCategories();
            renderGames();
        }

        // Toggle Favorites Filter Mode
        function toggleFavoritesFilter() {
            showFavsOnly = !showFavsOnly;
            const btn = document.getElementById('favorite-toggle-btn');
            if (showFavsOnly) {
                btn.classList.add('border-neon-pink', 'bg-neon-pink/20');
                document.getElementById('section-title').innerHTML = `
                    <i class="fa-solid fa-heart text-neon-pink"></i> FAVORITE GAMES
                `;
            } else {
                btn.classList.remove('border-neon-pink', 'bg-neon-pink/20');
                filterCategory('All');
            }
            renderGames();
        }

        // Handle Search Bar Input
        function handleSearch(e) {
            searchQuery = e.target.value.toLowerCase().trim();
            const clearBtn = document.getElementById('clear-search');
            if (searchQuery.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderGames();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            searchQuery = '';
            document.getElementById('clear-search').classList.add('hidden');
            renderGames();
        }

        function resetFilters() {
            clearSearch();
            filterCategory('All');
        }

        // Toggle Favorite Game
        function toggleFav(gameId, element) {
            event.stopPropagation();
            const index = favorites.indexOf(gameId);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(gameId);
            }
            localStorage.setItem('neon_favs', JSON.stringify(favorites));
            updateFavBadge();
            renderGames();
        }

        function updateFavBadge() {
            const badge = document.getElementById('fav-badge');
            if (favorites.length > 0) {
                badge.innerText = favorites.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // Render Game Cards List
        function renderGames() {
            const grid = document.getElementById('game-grid');
            const noResults = document.getElementById('no-results');

            let filtered = gamesData.filter(game => {
                const matchesCategory = currentCategory === 'All' || game.category === currentCategory;
                const matchesSearch = game.title.toLowerCase().includes(searchQuery) || game.category.toLowerCase().includes(searchQuery);
                const matchesFavs = !showFavsOnly || favorites.includes(game.id);
                return matchesCategory && matchesSearch && matchesFavs;
            });

            document.getElementById('game-count').innerText = `${filtered.length} Games`;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                noResults.classList.add('flex');
                return;
            }

            noResults.classList.add('hidden');
            noResults.classList.remove('flex');

            grid.innerHTML = filtered.map(game => {
                const isFav = favorites.includes(game.id);
                return `
                    <div 
                        onclick="openPlayModal('${game.title}', '${game.category}', '${game.image}', '${game.type}')"
                        class="glass-card rounded-2xl overflow-hidden border border-white/10 hover:border-neon-cyan/60 active:scale-95 transition-all duration-200 flex flex-col justify-between group relative"
                    >
                        <!-- Card Image Header -->
                        <div class="relative h-28 sm:h-36 overflow-hidden">
                            <img src="${game.image}" alt="${game.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent"></div>
                            
                            <!-- Badges -->
                            ${game.badge ? `<span class="absolute top-2 left-2 bg-neon-pink text-black text-[9px] font-black px-1.5 py-0.5 rounded uppercase tracking-wider">${game.badge}</span>` : ''}
                            
                            <!-- Favorite Heart Button -->
                            <button 
                                onclick="toggleFav('${game.id}', this)"
                                class="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center text-xs text-white border border-white/20 active:scale-90"
                            >
                                <i class="${isFav ? 'fa-solid text-neon-pink' : 'fa-regular'} fa-heart"></i>
                            </button>

                            <!-- Rating overlay -->
                            <div class="absolute bottom-1.5 left-2 flex items-center space-x-1 text-[10px] text-yellow-400 font-bold bg-black/50 px-1.5 py-0.5 rounded-md backdrop-blur-sm">
                                <i class="fa-solid fa-star text-[9px]"></i>
                                <span>${game.rating}</span>
                            </div>
                        </div>

                        <!-- Card Content -->
                        <div class="p-2.5 flex flex-col flex-1 justify-between space-y-2">
                            <div>
                                <h4 class="font-display font-bold text-xs text-white line-clamp-1 group-hover:text-neon-cyan transition-colors">${game.title}</h4>
                                <p class="text-[10px] text-gray-400 font-medium">${game.category}</p>
                            </div>

                            <button class="w-full bg-white/5 group-hover:bg-neon-cyan group-hover:text-black border border-white/10 group-hover:border-neon-cyan text-neon-cyan font-bold py-1.5 rounded-lg text-[11px] flex items-center justify-center space-x-1.5 transition-all">
                                <i class="fa-solid fa-play text-[9px]"></i>
                                <span>PLAY</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Open Game Simulator Modal
        function openPlayModal(title, category, image, type) {
            simScore = 0;
            document.getElementById('sim-score').innerText = '00000';
            document.getElementById('modal-game-title').innerText = title;
            document.getElementById('modal-game-cat').innerText = category;
            document.getElementById('sim-game-name').innerText = title;
            
            const modal = document.getElementById('play-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closePlayModal() {
            const modal = document.getElementById('play-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        // Interactive arcade button trigger inside modal
        function triggerGameAction(action) {
            simScore += Math.floor(Math.random() * 50) + 10;
            document.getElementById('sim-score').innerText = String(simScore).padStart(5, '0');
            
            const feedback = document.getElementById('action-feedback');
            feedback.innerText = `${action}!`;
            feedback.classList.add('text-neon-cyan');
            
            setTimeout(() => {
                feedback.innerText = 'READY';
                feedback.classList.remove('text-neon-cyan');
            }, 300);
        }

        // Random Game Selector
        function showRandomGame() {
            const randomIndex = Math.floor(Math.random() * gamesData.length);
            const randomGame = gamesData[randomIndex];
            openPlayModal(randomGame.title, randomGame.category, randomGame.image, randomGame.type);
        }

        // Simulated Fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
